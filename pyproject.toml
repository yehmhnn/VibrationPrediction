[project]
name = "vibration_prediction"
version = "0.1.0"
description = "High-frequency vibration forecasting and reporting workspace."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tsflow = { path = "../TSFlow", editable = true }

[tool.pixi.dependencies]
numpy = ">=1.25"
matplotlib = ">=3.8"
pandas = ">=2.1"
gluonts = "==0.14.4"
aim = "==3.20.1"
lightning = "==2.5.0.post0"
scipy = "==1.15.1"
pot = "==0.9.5"
scikit-learn = "==1.6.1"
einops = "==0.8.1"
ema_pytorch = "==0.7.7"
opt_einsum = "==3.4.0"
attrs = "==25.1.0"
hydra-core = "==1.3.1"
jupyter = "==1.1.0"
pytorch = ">=2.5.1,<3"
torchvision = ">=0.20.1,<0.21"
torchaudio = ">=2.5.1,<3"
setuptools = "<70"
[tool.pixi.tasks]
preprocess-cwru = "python scripts/preprocess_cwru.py"
figures = "python scripts/generate_figures.py"
smoke = "python scripts/train_timesnet_smoke.py"
smoke-flow = "python scripts/train_flow_smoke.py"
experiments = "python scripts/run_experiments.py"
baselines = "python scripts/run_baselines.py"
check-gpu = "python -c \"import torch; print('CUDA available:', torch.cuda.is_available()); print('Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')\""

[tool.pixi.feature.cpu]
dependencies = {pytorch-cpu = "==2.5.1"}

[tool.pixi.feature.gpu]
system-requirements = {cuda = "12"}
channels = ["nvidia"]
dependencies = {pytorch-gpu = "==2.5.1", cuda-nvrtc = ">=12.9.86,<13", cuda-nvcc = ">=12.9.86,<13"}

[tool.pixi.environments]
default = {features = ["gpu"]}
cpu = {features = ["cpu"]}
